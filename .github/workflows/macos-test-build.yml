name: macOS test build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/macos-test-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-test-build
  cancel-in-progress: true

jobs:
  build-universal-dmg:
    name: Build universal DMG
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      - name: Install frontend dependencies
        run: npm ci

      - name: Build ad-hoc signed universal DMG
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: --target universal-apple-darwin --bundles dmg
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: RunDev-macOS-universal-[version]
