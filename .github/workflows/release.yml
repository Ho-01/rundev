name: Release RunDev

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Match tag and application version
        run: npm run version:check-tag

  create-release:
    name: Create GitHub release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}

    steps:
      - name: Create public GitHub release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              return existing.data.id;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const created = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `RunDev ${tag}`,
              body: "Windows NSIS 설치 프로그램과 Apple Silicon/Intel용 macOS DMG입니다. Updater 서명 아티팩트(.sig, latest.json)가 포함됩니다. macOS 코드 서명 및 notarization 전 단계라 운영체제의 보안 경고가 표시될 수 있습니다.",
              draft: false,
              prerelease: false
            });
            return created.data.id;

  build:
    name: Build ${{ matrix.label }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows NSIS
            args: --bundles nsis
          - os: macos-latest
            label: macOS Apple Silicon DMG
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: macos-latest
            label: macOS Intel DMG
            args: --target x86_64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust universal macOS targets
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.os }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
